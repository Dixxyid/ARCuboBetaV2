<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'self' 'unsafe-inline' 'unsafe-eval'; worker-src * 'self' blob: data:; child-src * 'self' blob: data:; style-src * 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Astronomy WebAR Flashcards</title>

  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/glassmorphism.css">
  <link rel="stylesheet" href="./src/styles/hud.css">

  <!-- 8th Wall Engine + SLAM Binary (Lokal dari /public/xr/) -->
  <script src="./xr/xr.js" async data-preload-chunks="slam"></script>

  <!-- Vite akan resolve semua import dari node_modules secara otomatis -->
  <script type="module" src="./src/main.js"></script>
</head>

<body x-data="arApp">

  <!-- 3D WebGL Canvas Layer -->
  <div id="canvas-container"></div>

  <!-- UI Overlay (HUD Layer) -->
  <div class="hud-container">

    <!-- Header / Status Bar -->
    <header class="hud-header glass-card">
      <div class="brand">
        <span class="dot-indicator" :class="trackingState.toLowerCase()"></span>
        <h1 class="app-title">AstroARV7</h1>
      </div>
      <div class="status-badge" x-text="trackingStatusText"></div>
    </header>

    <!-- Notif Scan Permukaan 4 Arah (State: SURFACE_SCAN) -->
    <template x-if="trackingState === 'SURFACE_SCAN'">
      <div class="scanner-guide world-scan" x-transition.opacity.duration.300ms>
        <div class="scanner-box surface">
          <div class="corner top-left"></div>
          <div class="corner top-right"></div>
          <div class="corner bottom-left"></div>
          <div class="corner bottom-right"></div>
          <div class="scan-line"></div>
        </div>
        <p class="guide-text">Arahkan kamera ke sekeliling ruangan</p>
        <p class="guide-subtext">Gerakkan ke kiri, kanan, depan & permukaan bawah...</p>
        <div class="direction-grid">
          <span class="direction-tag" :class="{ 'active': scanProgress.left }">
            <span class="check">✓</span> Kiri
          </span>
          <span class="direction-tag" :class="{ 'active': scanProgress.right }">
            <span class="check">✓</span> Kanan
          </span>
          <span class="direction-tag" :class="{ 'active': scanProgress.front }">
            <span class="check">✓</span> Depan
          </span>
          <span class="direction-tag" :class="{ 'active': scanProgress.down }">
            <span class="check">✓</span> Bawah
          </span>
        </div>
      </div>
    </template>

    <!-- Modal Dialog Konfirmasi: Data Permukaan Terkumpul -->
    <template x-if="showSurfaceDoneModal">
      <div class="surface-confirm-overlay" x-transition.opacity.duration.300ms>
        <div class="surface-confirm-card glass-modal">
          <div class="confirm-icon-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </div>
          <h3 class="confirm-title">Data Permukaan Terkumpul!</h3>
          <p class="confirm-desc">Ruangan berhasil dipetakan oleh SLAM. Siapkan kartu flashcard dan klik OK untuk mulai
            memindai objek.</p>
          <button class="confirm-button-ok" @click="confirmSurfaceDone()">
            OK, Mulai Scan Objek
          </button>
        </div>
      </div>
    </template>

    <!-- Notif Cari Marker (State: MARKER_SCAN) -->
    <template x-if="trackingState === 'MARKER_SCAN' && !isLoadingModel">
      <div class="scanner-guide" x-transition.opacity.duration.300ms>
        <div class="scanner-box">
          <div class="corner top-left"></div>
          <div class="corner top-right"></div>
          <div class="corner bottom-left"></div>
          <div class="corner bottom-right"></div>
        </div>
        <p class="guide-text">Arahkan kamera ke Flashcard Planet</p>
      </div>
    </template>

    <!-- Notif Scan Ulang (State: VALIDATING gagal) -->
    <template x-if="showRescanNotif">
      <div class="rescan-notif glass-card" x-transition.opacity.duration.300ms>
        <svg class="icon warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Data tidak valid. Scan ulang permukaan...</span>
      </div>
    </template>

    <!-- Indikator SLAM World Anchor Locked -->
    <template x-if="trackingState === 'SLAM_LOCKED'">
      <div class="lock-indicator" x-transition.opacity.duration.300ms>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0110 0v4"></path>
        </svg>
        <span>SLAM World Anchor Terkunci</span>
      </div>
    </template>

    <!-- Badge Animasi Orbital Aktif (Muncul saat Bulan mengorbit Bumi) -->
    <template x-if="hasOrbitalAnimation">
      <div class="orbital-badge" x-transition.opacity.duration.500ms>
        <span class="orbital-icon">🌕</span>
        <div class="orbital-text">
          <span class="orbital-title">Orbit Aktif</span>
          <span class="orbital-desc">Bulan mengorbit Bumi</span>
        </div>
        <div class="orbital-pulse"></div>
      </div>
    </template>

    <!-- Loading Overlay -->
    <template x-if="isLoadingModel">
      <div class="loading-overlay" x-transition.opacity.duration.300ms>
        <div class="spinner"></div>
        <p class="loading-text">Memuat model 3D...</p>
      </div>
    </template>

    <!-- Error Toast -->
    <template x-if="loadError">
      <div class="error-toast glass-card" x-transition.opacity.duration.300ms>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span x-text="loadError"></span>
        <button @click="dismissError()" class="error-dismiss">&times;</button>
      </div>
    </template>

    <!-- Gesture Interaction Hint Pill -->
    <template
      x-if="selectedCelestial && !showDetail && !showSurfaceDoneModal && (trackingState === 'MARKER_TRACKING' || trackingState === 'SLAM_LOCKED')">
      <div class="gesture-hint-pill">
        <span>👆 Sentuh & geser untuk memutar</span>
        <span>•</span>
        <span>🤏 Cubit untuk zoom</span>
      </div>
    </template>

    <!-- Bottom Action Controls -->
    <footer class="hud-footer">
      <template x-if="selectedCelestial && (trackingState === 'MARKER_TRACKING' || trackingState === 'SLAM_LOCKED')">
        <div class="action-bar">
          <button @click="toggleDetailModal()" class="glass-button primary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Data Astronomi</span>
          </button>
          <!-- Tombol Dinamis Lock/Unlock Coordinate -->
          <button @click="toggleCoordinateLock()" class="glass-button secondary"
            :class="{ 'locked-slam': isSlamLocked }">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path x-show="isSlamLocked" d="M7 11V7a5 5 0 0110 0v4"></path>
              <path x-show="!isSlamLocked" d="M7 11V7a5 5 0 019.9-1"></path>
            </svg>
            <span x-text="isSlamLocked ? 'Unlock Coordinate' : 'Lock Coordinate'"></span>
          </button>
        </div>
      </template>
    </footer>

    <!-- Detail Information Modal -->
    <div class="modal-backdrop" x-show="showDetail" x-transition.opacity @click.self="showDetail = false"
      style="display: none;">
      <div class="modal-card glass-modal">
        <button class="modal-close" @click="showDetail = false">&times;</button>

        <div class="modal-header">
          <span class="subtitle" x-text="selectedCelestial?.category || 'Objek Astronomi'"></span>
          <h2 x-text="selectedCelestial?.name || 'Nama Celestial'"></h2>
        </div>

        <div class="modal-body">
          <p class="description" x-text="selectedCelestial?.description"></p>

          <!-- Technical Specs Matrix -->
          <div class="specs-grid">
            <div class="spec-item glass-inset">
              <span class="label">Massa</span>
              <span class="value" x-text="selectedCelestial?.mass || '-'"></span>
            </div>
            <div class="spec-item glass-inset">
              <span class="label">Jari-Jari Rata-rata</span>
              <span class="value" x-text="selectedCelestial?.radius || '-'"></span>
            </div>
            <div class="spec-item glass-inset">
              <span class="label">Jarak dari Matahari</span>
              <span class="value" x-text="selectedCelestial?.semiMajorAxis || '-'"></span>
            </div>
            <div class="spec-item glass-inset">
              <span class="label">Suhu Permukaan</span>
              <span class="value" x-text="selectedCelestial?.surfaceTemp || '-'"></span>
            </div>
          </div>

          <!-- Scientific Reference Section -->
          <template x-if="selectedCelestial?.doi">
            <div class="doi-reference glass-inset">
              <span class="doi-label">Rujukan Literatur Ilmiah (DOI):</span>
              <a :href="'https://doi.org/' + selectedCelestial.doi" target="_blank" rel="noopener" class="doi-link"
                x-text="selectedCelestial.doi"></a>
            </div>
          </template>
        </div>
      </div>
    </div>

  </div>

</body>

</html>
